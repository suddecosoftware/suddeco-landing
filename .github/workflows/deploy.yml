name: Build check for suddeco.com

# suddeco.com is served from the Hostinger VPS (815231, 195.110.58.213) as of
# 2026-08-09. It is no longer deployed to Cloudflare Pages.
#
# Deployment is pull-based: the systemd timer `suddeco-landing-deploy.timer` on
# the VPS polls origin/main every 5 minutes, and on a new commit runs
# /opt/suddeco/landing/build.sh (vite build in a node:20 container) into
# /var/www/suddeco-landing, then reloads nginx.
#
# This workflow only proves the build still compiles. Nothing here publishes.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npx vite build
        env:
          VITE_APP_URL: https://suddeco.com
          VITE_MY_SUDDECO_URL: https://my.suddeco.com
          VITE_MARKETPLACE_URL: https://suddecohomes.com
          VITE_SHOP_URL: https://materials.suddeco.com
